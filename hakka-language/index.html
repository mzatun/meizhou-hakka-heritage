<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>客家话 · 从𠊎字出发（骨架 v0.2）</title>
<!-- ============================================================
  客家话数字故事地图 · 骨架 v0.2
  v0.2 增量（老大评审四条）：
    1. 地形 3D：raster-dem + setTerrain + hillshade（地形=语言传播的地理逻辑）
    2. AOI 政区套合：DataV 市界合并成片，透明度叠加（弃矩形）
    3. 属性资料挂接：REGION_INFO 六字段模型 → 富面板分区块
    4. 点击片区 → 播放（占位音，链路已通）+ 专业故事面板（网站重点）
  风格：迁徙地图国风（暖纸色/楷体/浮层）+ 附图深绿主色
  ============================================================ -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
:root{
  --paper-a:#FBF4E4; --paper-b:#F3EAD5; --paper-c:#ECE2C8; --paper-d:#E4D5B4;
  --ink:#2E3A2E; --ink-soft:#4A5A46; --ink-faint:#7A8874;
  --zhu:#2D5A3D; --zhu-deep:#1F4029; --zhu-soft:#3E7350; --tag:#E8F0E8;
  --gold:#BD9A55; --gold-soft:#D8C08A; --gold-deep:#A07B3F;
  --accent-red:#C0553A; --green:#1D9E75; --blue:#2E5E8C; --orange:#C05621;
  --map-bg:#E8DEC4;
  --elev:0 2px 10px rgba(46,58,46,.10),0 14px 34px rgba(46,58,46,.16);
  --elev-sm:0 1px 4px rgba(46,58,46,.10),0 4px 12px rgba(46,58,46,.12);
  --radius:14px; --radius-sm:9px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Kaiti SC","STKaiti","KaiTi","FZKai-Z03S","PingFang SC","Microsoft YaHei",serif;
  color:var(--ink);background:var(--paper-c);
}
#topbar{
  position:absolute;top:0;left:0;right:0;z-index:20;
  padding:16px 20px 8px;text-align:center;pointer-events:none;
  background:linear-gradient(180deg,rgba(243,234,213,.92),rgba(243,234,213,0));
}
#topbar h1{display:inline-block;font-size:30px;color:var(--zhu-deep);letter-spacing:.12em;
  font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.6);position:relative;padding:0 34px}
#topbar h1::before,#topbar h1::after{content:"";position:absolute;top:50%;width:26px;height:2px}
#topbar h1::before{left:0;background:linear-gradient(90deg,transparent,var(--gold))}
#topbar h1::after{right:0;background:linear-gradient(90deg,var(--gold),transparent)}
#topbar .sub{font-size:13px;color:var(--ink-soft);letter-spacing:.34em;margin-top:3px}
#topbar .ver{position:absolute;right:16px;top:16px;font-size:11px;color:var(--ink-faint);
  border:1px solid var(--gold-soft);border-radius:999px;padding:2px 10px;background:rgba(251,244,228,.8)}

#toolbar{position:absolute;left:14px;top:96px;z-index:15;width:180px;
  background:rgba(251,244,228,.94);border:1px solid var(--gold-soft);
  border-radius:var(--radius);box-shadow:var(--elev);overflow:hidden}
#toolbar .tb-head{padding:9px 14px 7px;font-size:12px;color:var(--ink-faint);
  letter-spacing:.2em;border-bottom:1px solid rgba(189,154,85,.22)}
#toolbar .tb-row{padding:9px 14px;border-bottom:1px solid rgba(189,154,85,.12);
  display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;transition:background .15s}
#toolbar .tb-row:hover{background:var(--paper-b)}
#toolbar .tb-row .dot{width:11px;height:11px;border-radius:50%;background:var(--c);
  border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);flex-shrink:0}
#toolbar .tb-row .sw{margin-left:auto;width:26px;height:15px;border-radius:999px;
  background:#c9bfa4;position:relative;transition:background .2s;flex-shrink:0}
#toolbar .tb-row .sw::after{content:"";position:absolute;left:2px;top:2px;width:11px;height:11px;
  border-radius:50%;background:#fff;transition:left .2s}
#toolbar .tb-row.on .sw{background:var(--zhu)}
#toolbar .tb-row.on .sw::after{left:13px}
#toolbar .tb-note{padding:8px 14px 10px;font-size:11px;color:var(--ink-faint);line-height:1.5}
#toolbar .tb-row .go{margin-left:auto;font-size:10px;color:var(--gold-deep);flex-shrink:0}
.p-note{font-size:12px;color:var(--ink-faint);line-height:1.7;background:var(--tag);
  border:1px solid var(--gold-soft);border-radius:9px;padding:8px 11px;margin-top:9px}
.media-list{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.m-item{border:1px solid rgba(189,154,85,.3);border-radius:9px;padding:8px 11px;background:#fff}
.m-item a{color:var(--zhu);text-decoration:none;font-size:13px}
.m-item a:hover{text-decoration:underline}
.m-desc{font-size:12px;color:var(--ink-soft);line-height:1.55;margin-top:3px}
.m-meta{font-size:10.5px;color:var(--ink-faint);margin-top:4px;letter-spacing:.02em}
.s-item{border:1px solid rgba(189,154,85,.3);border-radius:9px;padding:8px 11px;background:#fff;
  margin-top:7px;cursor:pointer;font-size:13px;line-height:1.5;transition:.15s}
.s-item:hover{border-color:var(--zhu);background:var(--tag)}
.s-item .src{font-size:11px;color:var(--ink-faint)}

#map{position:absolute;inset:0;background:var(--map-bg)}

#timeline{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:15;
  width:min(760px,calc(100% - 40px));background:rgba(251,244,228,.94);
  border:1px solid var(--gold-soft);border-radius:var(--radius);box-shadow:var(--elev);
  padding:12px 22px 16px}
#timeline .tl-year{font-size:20px;color:var(--zhu-deep);font-weight:700;text-align:center;letter-spacing:.08em}
#timeline .tl-era{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:1px;letter-spacing:.14em}
#timeline input[type=range]{width:100%;margin-top:10px;-webkit-appearance:none;height:4px;
  border-radius:2px;background:linear-gradient(90deg,var(--gold-soft),var(--zhu-soft));outline:none}
#timeline input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
  border-radius:50%;background:var(--zhu);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer}
#timeline .tl-marks{display:flex;justify-content:space-between;margin-top:6px}
#timeline .tl-marks span{font-size:10.5px;color:var(--ink-faint);letter-spacing:.02em;white-space:nowrap}
#timeline .tl-marks span.cur{color:var(--zhu);font-weight:700}
#timeline .tl-detail{margin-top:9px;padding-top:8px;border-top:1px dashed rgba(189,154,85,.4)}
#timeline .tl-d-title{font-size:14px;color:var(--zhu-deep);font-weight:700;letter-spacing:.04em}
#timeline .tl-d-impact{font-size:12px;color:var(--ink-soft);line-height:1.6;margin-top:3px}
#timeline .tl-d-src{font-size:10.5px;color:var(--ink-faint);margin-top:4px}
#timeline .tl-d-src .tl-ok{color:var(--green);font-weight:700}
#timeline .tl-fold{position:absolute;right:10px;top:9px;width:24px;height:24px;border-radius:50%;
  border:1px solid var(--gold-soft);background:#fff;color:var(--zhu);cursor:pointer;font-size:12px;line-height:1;z-index:2}
#timeline .tl-fold:hover{background:var(--zhu);color:#fff}
#tl-restore{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:15;
  display:none;align-items:center;gap:6px;font-size:13px;color:var(--zhu-deep);
  background:rgba(251,244,228,.95);border:1px solid var(--gold-soft);border-radius:999px;
  padding:6px 16px;cursor:pointer;box-shadow:var(--elev);letter-spacing:.1em}
#tl-restore:hover{background:var(--zhu);color:#fff}

#panel{position:absolute;right:14px;top:96px;z-index:15;width:318px;max-height:calc(100% - 200px);
  background:rgba(251,244,228,.97);border:1px solid var(--gold-soft);border-radius:var(--radius);
  box-shadow:var(--elev);overflow:auto;transform:translateX(360px);transition:transform .3s}
#panel.open{transform:translateX(0)}
#panel .p-head{padding:13px 16px 9px;border-bottom:1px solid rgba(189,154,85,.25)}
#panel .p-tag{display:inline-block;font-size:11px;color:var(--zhu);background:var(--tag);
  border:1px solid var(--gold-soft);border-radius:999px;padding:2px 10px;letter-spacing:.1em}
#panel .p-title{font-size:20px;color:var(--zhu-deep);font-weight:700;margin-top:7px}
#panel .p-body{padding:4px 16px 16px;font-size:13.5px}
#panel .p-close{position:absolute;top:9px;right:11px;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--gold-soft);background:#fff;color:var(--zhu);cursor:pointer;font-size:14px;line-height:1}
#panel .p-close:hover{background:var(--zhu);color:#fff}
/* 语音横幅（重点4：先听音） */
.p-voice{background:var(--tag);border:1px solid var(--gold-soft);border-radius:11px;
  padding:11px 13px;margin:10px 0 4px}
.p-voice .pv-play{display:flex;align-items:center;gap:10px;cursor:pointer}
.p-voice .pv-btn{width:38px;height:38px;border-radius:50%;background:var(--accent-red);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;
  box-shadow:0 3px 8px rgba(192,85,58,.35);transition:transform .15s;flex-shrink:0}
.p-voice .pv-btn:hover{transform:scale(1.06)}
.p-voice .pv-word{font-size:23px;line-height:1.1}
.p-voice .pv-ipa{font-size:12.5px;color:var(--ink-faint);letter-spacing:.06em;margin-top:1px}
.p-voice .pv-note{margin-top:7px;font-size:11px;color:var(--ink-faint);border-top:1px dashed rgba(189,154,85,.4);padding-top:6px;line-height:1.5}
.p-voice .pv-chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.p-voice .pv-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--zhu);
  border:1px solid var(--gold-soft);background:#fff;border-radius:999px;padding:3px 11px;cursor:pointer;transition:.15s}
.p-voice .pv-chip:hover{background:var(--zhu);color:#fff}
.p-voice .pv-chip b{color:var(--accent-red)}
.p-voice .pv-chip:hover b{color:#fff}
/* 资料区块 */
.p-sec{margin-top:11px}
.p-sec h4{font-size:12px;color:var(--zhu);letter-spacing:.12em;border-left:3px solid var(--gold);
  padding-left:8px;margin-bottom:5px}
.p-sec p{font-size:13px;line-height:1.75;color:var(--ink-soft)}
.p-sec ul{margin:2px 0 0 0;padding:0;list-style:none}
.p-sec li{font-size:12.5px;line-height:1.6;color:var(--ink-soft);padding:2px 0 2px 16px;position:relative}
.p-sec li::before{content:"";position:absolute;left:2px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--gold)}
.p-sec .chip{display:inline-block;font-size:11px;color:var(--accent-red);border:1px solid var(--gold-soft);
  background:#fff;border-radius:999px;padding:2px 10px;margin:2px 4px 2px 0}
.p-sec .src{margin-top:8px;font-size:11px;color:var(--ink-faint);line-height:1.6}

#soundbar{position:absolute;right:14px;bottom:16px;z-index:15;
  background:rgba(46,58,46,.92);color:#fff;border-radius:12px;box-shadow:var(--elev);
  border:1px solid rgba(216,192,138,.4);padding:9px 14px;display:flex;align-items:center;gap:12px}
#soundbar .sb-ico{width:30px;height:30px;border-radius:50%;background:var(--accent-red);
  display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex-shrink:0}
#soundbar .sb-txt{font-size:12px;line-height:1.4;letter-spacing:.04em}
#soundbar .sb-txt b{color:var(--gold-soft)}

.hint{position:absolute;left:50%;top:88px;transform:translateX(-50%);z-index:12;
  font-size:12px;color:var(--ink-faint);letter-spacing:.2em;background:rgba(251,244,228,.7);
  padding:4px 16px;border-radius:999px;pointer-events:none}
/* 加载状态 */
#loading{position:absolute;inset:0;z-index:30;background:var(--paper-b);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  font-size:14px;color:var(--ink-soft);letter-spacing:.2em;transition:opacity .5s}
#loading .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--gold-soft);
  border-top-color:var(--zhu);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:720px){
  #toolbar{width:150px;left:10px;top:84px}
  #panel{width:calc(100% - 20px);right:10px}
  #soundbar{right:10px;bottom:120px}
  #topbar h1{font-size:21px;padding:0 24px}
}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div>山河在加载 · 听客家从山间开口</div>

<header id="topbar">
  <h1>客家话 · 从「𠊎」字出发</h1>
  <div class="sub">语系分布 · 演化历史 · 非遗传承 · 文化故事</div>
  <span class="ver">骨架 v0.2</span>
</header>

<aside id="toolbar">
  <div class="tb-head">板块 · PANELS</div>
  <div class="tb-row" data-panel="media" style="--c:#C0553A"><span class="dot"></span>视听资料<span class="go">▶</span></div>
  <div class="tb-row" data-panel="theory" style="--c:#2D5A3D"><span class="dot"></span>演变学术<span class="go">▶</span></div>
  <div class="tb-row" data-panel="protect" style="--c:#1D9E75"><span class="dot"></span>传承保护<span class="go">▶</span></div>
  <div class="tb-row" data-panel="clan" style="--c:#8A7A55"><span class="dot"></span>姓氏族谱<span class="go">▶</span></div>
  <div class="tb-head">图层 · LAYERS</div>
  <div class="tb-row on" data-layer="regions" style="--c:#2D5A3D"><span class="dot"></span>语系分片（政区套合）<span class="sw"></span></div>
  <div class="tb-row on" data-layer="points" style="--c:#C0553A"><span class="dot"></span>方言代表点<span class="sw"></span></div>
  <div class="tb-row" data-layer="terrain" style="--c:#8A7A55"><span class="dot"></span>地形立体<span class="sw"></span></div>
  <div class="tb-note">点击任一色块：先听一段当地客家话，再看方言特点与来龙去脉。地形起伏即客家话存古的地理「保温箱」。</div>
</aside>

<div id="map"></div>
<div class="hint">点击色块听声音 · 拖动时间轴看演化</div>

<aside id="timeline">
  <button class="tl-fold" id="tl-fold" title="收起时间轴">▾</button>
  <div class="tl-year" id="tl-year">317 年</div>
  <div class="tl-era" id="tl-era">两晋 · 衣冠南渡</div>
  <input type="range" id="tl-slider" min="0" max="7" value="7" step="1">
  <div class="tl-marks" id="tl-marks"></div>
  <div class="tl-detail" id="tl-detail">
    <div class="tl-d-title" id="tl-d-title"></div>
    <div class="tl-d-impact" id="tl-d-impact"></div>
    <div class="tl-d-src" id="tl-d-src"></div>
  </div>
</aside>
<button id="tl-restore">◈ 时间轴</button>

<aside id="panel">
  <button class="p-close" onclick="closePanel()">✕</button>
  <div class="p-head">
    <span class="p-tag" id="p-tag">语系分片</span>
    <div class="p-title" id="p-title">粤台片</div>
  </div>
  <div class="p-body" id="p-body"></div>
</aside>

<aside id="soundbar">
  <div class="sb-ico" id="sb-play">▶</div>
  <div class="sb-txt" id="sb-txt"><b>听见客家</b><br>点击地图上的色块</div>
</aside>

<script>
/* ============================================================
   CONFIG
============================================================ */
const CONFIG={
  center:[115.0,25.2],zoom:5.2,pitch:0,      // 默认 2D 平视；开「地形立体」开关才转 3D 俯冲
  reliefImage:{url:"assets/relief.webp",
    coordinates:[[67.5,55.77657],[140.625,55.77657],[140.625,16.63619],[67.5,16.63619]]},
  terrainTiles:"https://demotiles.maplibre.org/terrain-tiles/{z}/{x}/{y}.png", // terrarium 编码
  provinceUrl:"https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json",
  cityBoundBase:"https://geo.datav.aliyun.com/areas_v3/bound/"  // {adcode}.json 市界
};

/* ============================================================
   TIMELINE · 主时间轴（单一主时间轴驱动，系列铁律）
============================================================ */
const TIMELINE = [{"year":317,"era":"两晋 · 衣冠南渡","title":"永嘉之乱 · 第一次迁徙","impact":"古中原汉语南下奠基。是否直接构成客家源头，学界有争议。","source":"罗香林《客家研究导论》(1933)","verified":false},{"year":878,"era":"唐末 · 二次南迁","title":"黄巢之乱 · 第二次迁徙","impact":"北人南迁赣南、闽西，先民落籍赣闽粤交界，积累赣语底层。","source":"罗香林《客家研究导论》(1933)","verified":false},{"year":1279,"era":"宋末 · 客家成型","title":"宋室南渡 · 第三次迁徙","impact":"学界主流认为客家话于宋代基本成型，以嘉应州一带为中心。","source":"罗香林(1933)；Norman《Chinese》(1988)；李如龙","verified":true},{"year":1733,"era":"清 · 嘉应直隶州","title":"雍正十一年升嘉应直隶州","impact":"「嘉应五属」成为客家话核心地理单元；台湾「四县腔」即源出其中四县。","source":"《清史稿·地理志》","verified":true},{"year":1868,"era":"清末 · 五迁过番","title":"土客械斗后第五次大扩散","impact":"1854-1867 土客械斗后，客民迁粤西、广西、海南、台湾及过番南洋，客家话地理大扩散。","source":"罗香林；土客械斗研究","verified":false},{"year":1988,"era":"近代 · 客语自觉","title":"「还我客家话」运动","impact":"台湾客语权利运动起步；王保畬《客家话拼音方案》推动标准化。","source":"相关文献（日期待核实）","verified":false},{"year":2015,"era":"当代 · 语保工程","title":"中国语言资源保护工程启动","impact":"客家方言系统性调查、采录、建档（世界最大语言资源库）。","source":"教育部、国家语委","verified":true},{"year":2026,"era":"当代 · 传承保护","title":"制度化保护与活态传承","impact":"台湾《国家语言发展法》(2019) 列客语为国家语言；梅州等地客家话进校园。","source":"官方公报（进校园待核实）","verified":false}];

/* ============================================================
   REGION_INFO · 片区属性数据模型（重点3：资料挂接）
   六字段：voice语音 / features特点 / evolution演化 / heritage非遗 / story故事 / sources来源

const map=new maplibregl.Map({
  container:"map",
  style:{version:8,sources:{},layers:[{id:"bg",type:"background",paint:{"background-color":"#E8DEC4"}}]},
  center:CONFIG.center,zoom:CONFIG.zoom,pitch:CONFIG.pitch,
  attributionControl:false,maxPitch:70
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");

map.on("load",()=>{
  addBasemap();
  addTerrainAndSky();          // 重点1：地形
  loadProvince();              // 省界骨架
  loadPolityRegions();         // 重点2：政区套合 AOI
  addPoints();                 // 代表点
  addMarkIcons();               // 地理标注 SVG + 木刻山符号（山符号加载完自动挂山脉层）
  addGeoMark();                 // 地理标注（突出字体）
  bindInteractions();
  setTimeout(()=>{const l=document.getElementById("loading");if(l){l.style.opacity=0;setTimeout(()=>l.remove(),600);}},600);
});

function addBasemap(){
  // 国风分层设色地形底图（与迁徙地图同款 relief 图，image source 贴地）
  map.addSource("relief",{type:"image",url:CONFIG.reliefImage.url,coordinates:CONFIG.reliefImage.coordinates});
  map.addLayer({id:"relief-layer",type:"raster",source:"relief",paint:{"raster-opacity":1}});
}

/* 重点1：地形数据 —— 默认 2D 平面 + hillshade 山体阴影（晕渲即可见地形感）
   打开「地形立体」开关时才 setTerrain 切 3D 俯冲（与开关状态严格一致） */
function addTerrainAndSky(){
  // DEM 仅供「地形立体」3D 开关（底图已是国风分层设色地形）
  map.addSource("terrain",{type:"raster-dem",tiles:[CONFIG.terrainTiles],encoding:"terrarium",tileSize:256});
  map.once("idle",()=>map.fitBounds([[108.5,20.8],[122.5,32.0]],{padding:{top:80,bottom:120,left:40,right:340},duration:1800}));
}

function loadProvince(){
  fetch(CONFIG.provinceUrl).then(r=>r.json()).then(geo=>{
    map.addSource("prov",{type:"geojson",data:geo});
    map.addLayer({id:"prov-line",type:"line",source:"prov",paint:{"line-color":"#A89468","line-width":0.8,"line-opacity":0.55}});
  }).catch(()=>console.warn("省界未加载（离线环境正常）"));
}

/* 重点2：政区套合 AOI → fetch 市界合并成片，fill 透明度叠加 */
function loadPolityRegions(){
  const feats=REGION_GEOJSON.features||[];
  console.log('政区套合：'+feats.length+' 个市级面（本地内联，无网络依赖）');
  if(!feats.length){console.warn('无政区数据');return;}
  map.addSource("regions",{type:"geojson",data:REGION_GEOJSON});
  map.addLayer({id:"regions-fill",type:"fill",source:"regions",
    paint:{"fill-color":["get","color"],"fill-opacity":0.30,"fill-outline-color":"#fff"},
    filter:["<=",["get","form_year"],1733]});
  map.addLayer({id:"regions-line",type:"line",source:"regions",
    paint:{"line-color":["get","color"],"line-width":0.9,"line-opacity":0.65},
    filter:["<=",["get","form_year"],1733]});
  applyTimeline(+slider.value);
}

function addPoints(){
  map.addSource("points",{type:"geojson",data:POINTS});
  map.addLayer({id:"points-circle",type:"circle",source:"points",
    paint:{"circle-radius":6,"circle-color":"#C0553A","circle-stroke-color":"#fff","circle-stroke-width":2}});
  map.addLayer({id:"points-label",type:"symbol",source:"points",
    layout:{"text-field":["get","name"],"text-size":11,"text-offset":[0,1.2],"text-font":["Noto Sans CJK SC Regular"]},
    paint:{"text-color":"#7A2414","text-halo-color":"#FBF4E4","text-halo-width":1.2}});
}
function addGeoMark(){
  const fc={type:"FeatureCollection",features:GEOMARK.map(g=>({type:"Feature",
    properties:{name:g.name,tag:g.tag||"",icon:"mark-"+(g.type||"mountain")},
    geometry:{type:"Point",coordinates:g.coord}}))};
  map.addSource("geomark",{type:"geojson",data:fc});
  map.addLayer({id:"geomark-l",type:"symbol",source:"geomark",
    layout:{"icon-image":["get","icon"],"icon-size":0.85,"icon-allow-overlap":true,
      "text-field":["concat",["get","name"],"\n",["get","tag"]],
      "text-size":12,"text-offset":[0,1.1],"text-line-height":1.3,"text-font":["Noto Sans CJK SC Regular"]},
    paint:{"text-color":"#6B5630","text-halo-color":"#FBF4E4","text-halo-width":1.4}});
}

function addMarkIcons(){
  Object.entries(MARK_ICONS).forEach(([k,svg])=>{
    const img=new Image();
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    img.onload=()=>{ if(!map.hasImage('mark-'+k)) map.addImage('mark-'+k,img); };
  });
  // 木刻山符号（迁徙地图同款国风山形，zuodong 资产）；全部加载完成后才挂山脉符号层
  const mountFiles=["assets/zuodong/m1-0.png","assets/zuodong/m2-0.png","assets/zuodong/m3-0.png"];
  let mLoaded=0;
  mountFiles.forEach((f,i)=>{
    const img=new Image();
    img.src=f;
    img.onload=()=>{ if(!map.hasImage('mount'+(i+1))) map.addImage('mount'+(i+1),img); mLoaded++; if(mLoaded===mountFiles.length) addMountSymbols(); };
    img.onerror=()=>{ mLoaded++; if(mLoaded===mountFiles.length) addMountSymbols(); };
  });
}

const MOUNTS=[

function addMountSymbols(){
  const fc={type:"FeatureCollection",features:MOUNTS.map((m,i)=>({type:"Feature",
    properties:{icon:"mount"+((i%3)+1),name:m.name},geometry:{type:"Point",coordinates:m.coord}}))};

/* ============================================================
   交互：点击片区 → 播放方言 + 富资料面板（重点4：网站重点）
============================================================ */
function bindInteractions(){
  map.on("click","regions-fill",e=>{
    const r=e.features[0].properties.region||e.features[0].properties.name;
    const info=REGION_INFO[r]; if(!info) return;
    playRegionVoice(info);          // 先听音
    openRegionPanel(info);          // 再看资料
    map.easeTo({center:e.lngLat,zoom:Math.max(map.getZoom(),6.2),duration:900});
  });
  map.on("click","points-circle",e=>{
    const p=e.features[0].properties;
    openPanel("方言代表点",p.label,`<p style="color:var(--ink-soft)">${p.name} · 代表音。点击相邻色块可进入片区详情。</p>`,"资料来源：待补充");
  });
  ["regions-fill","points-circle"].forEach(l=>{
    map.on("mouseenter",l,()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave",l,()=>map.getCanvas().style.cursor="");
  });
}

function openRegionPanel(info){
  const v=info.voice;
  document.getElementById("p-tag").textContent="语系分片 · "+info.name;
  document.getElementById("p-title").textContent=info.name;
  const audioArr=v.audio||[];
  const chips=audioArr.length?'<div class="pv-chips">'+audioArr.map((a,i)=>'<span class="pv-chip" onclick="playRegionVoice(window.__REGION,'+i+')">▶ <b>'+a.word+'</b> '+(a.ipa||'')+'</span>').join('')+'</div>':'';
  let h=`<div class="p-voice">
    <div class="pv-play" onclick="playRegionVoice(window.__REGION)">
      <div class="pv-btn">▶</div>
      <div>
        <div class="pv-word">${v.word}</div>
        <div class="pv-ipa">${v.ipa} · ${v.label}</div>
      </div>
    </div>
    ${chips}
    <div class="pv-note">${v.note}</div>
  </div>
  <div class="p-sec"><h4>方言特点</h4><p style="color:var(--accent-red)">${info.tone}</p><ul>${info.features.map(f=>`<li>${f}</li>`).join("")}</ul></div>
  <div class="p-sec"><h4>演化过程</h4><p>${info.evolution}</p></div>
  <div class="p-sec"><h4>非遗传承</h4>${info.heritage.map(x=>`<span class="chip">${x}</span>`).join("")}</div>
  <div class="p-sec"><h4>文化故事</h4><p>${info.story}</p></div>
  <div class="p-sec"><h4>资料来源</h4><div class="src">${info.sources.map(s=>`· ${s.name}${s.url?`（<a href="${s.url}" target="_blank" style="color:var(--zhu)">链接</a>）`:""}：${s.note}`).join("<br>")}<br>· 待阶段 0 核实后回填证据链（source{name,url,quote}）</div></div>`;
  document.getElementById("p-body").innerHTML=h;
  document.getElementById("panel").classList.add("open");
  window.__REGION=info;
}
function openPanel(tag,title,body,src){
  document.getElementById("p-tag").textContent=tag;
  document.getElementById("p-title").textContent=title;
  document.getElementById("p-body").innerHTML=`<p style="color:var(--ink-soft)">${body}</p><div class="p-sec"><h4>资料来源</h4><div class="src">${src}</div></div>`;
  document.getElementById("panel").classList.add("open");
}
function closePanel(){document.getElementById("panel").classList.remove("open");}
/* 面板可移动：按住头部拖拽（close 按钮除外） */
(function(){
  const pnl=document.getElementById("panel"),pHead=pnl.querySelector(".p-head");
  let d=false,ox=0,oy=0;
  pHead.addEventListener("mousedown",e=>{
    if(e.target.closest(".p-close"))return;
    d=true;const r=pnl.getBoundingClientRect();
    ox=e.clientX-r.left;oy=e.clientY-r.top;
    pnl.style.right="auto";pnl.style.left=r.left+"px";pnl.style.top=r.top+"px";pnl.style.bottom="auto";
    pHead.style.cursor="grabbing";e.preventDefault();
  });
  document.addEventListener("mousemove",e=>{if(!d)return;pnl.style.left=(e.clientX-ox)+"px";pnl.style.top=(e.clientY-oy)+"px";});
  document.addEventListener("mouseup",()=>{d=false;pHead.style.cursor="";});
})();

/* ============================================================
   声音：播放链路（骨架占位音）+ 声音条
   真实公开音源（维基共享/客语辞典/语保平台）阶段 2 逐区核实挂接
============================================================ */
let audioCtx=null; let __audio=null;
function playFile(url){
  if(__audio){try{__audio.pause();}catch(e){}}
  const a=new Audio(url); __audio=a;
  a.play().catch(()=>console.warn('音频播放失败:',url));
  return a;
}
function playRegionVoice(info,idx){
  const arr=(info.voice&&info.voice.audio)||[];
  if(arr.length){
    const item=arr[idx||0];
    playFile(item.file);
    document.getElementById("sb-txt").innerHTML='<b>'+info.name+' · '+item.word+' '+(item.ipa||'')+'</b><br>'+item.src;
    document.getElementById("sb-play").textContent='❚❚';
    return;
  }
  const word=info.voice.word;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const n=audioCtx.createOscillator(), g=audioCtx.createGain();
    n.type="sine"; n.frequency.value=660; n.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.32,audioCtx.currentTime+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.55);
    n.start(); n.stop(audioCtx.currentTime+0.6);
  }catch(e){}
  document.getElementById("sb-txt").innerHTML='<b>'+info.name+' · '+word+' '+(info.voice.ipa||'')+'</b><br>真实音源待挂接';
  document.getElementById("sb-play").textContent='▶';
}
function pinSoundbar(){
  const sb=document.getElementById("soundbar");
  sb.style.transition="transform .3s";
}
document.getElementById("sb-play").addEventListener("click",()=>{
  if(window.__REGION) playRegionVoice(window.__REGION);
});

/* ============================================================
   TIMELINE · 主时间轴（时间驱动：片区按 form_year 点亮）
============================================================ */
const slider=document.getElementById("tl-slider");
const marksBox=document.getElementById("tl-marks");
TIMELINE.forEach((t,i)=>{
  const s=document.createElement("span");s.textContent=t.year;s.dataset.i=i;marksBox.appendChild(s);
});
slider.max=TIMELINE.length-1;
slider.addEventListener("input",()=>applyTimeline(+slider.value));
const tlFold=document.getElementById("tl-fold"),tlRestore=document.getElementById("tl-restore"),tlBox=document.getElementById("timeline");
tlFold.addEventListener("click",()=>{tlBox.style.display="none";tlRestore.style.display="flex";});
tlRestore.addEventListener("click",()=>{tlBox.style.display="block";tlRestore.style.display="none";});
function applyTimeline(i){
  const t=TIMELINE[i];
  document.getElementById("tl-year").textContent=t.year+" 年";
  document.getElementById("tl-era").textContent=t.era;
  const dt=document.getElementById("tl-d-title"),di=document.getElementById("tl-d-impact"),ds=document.getElementById("tl-d-src");
  if(dt){dt.textContent=t.title||"";}
  if(di){di.textContent=t.impact||"";}
  if(ds){ds.innerHTML=(t.source?("来源："+t.source):"")+(t.verified?' <span class="tl-ok">✓ 已核实</span>':"");}
  [...marksBox.children].forEach((s,j)=>s.classList.toggle("cur",j===i));
  if(map.getSource("regions")){
    const f=["<=",["get","form_year"],t.year];
    map.setFilter("regions-fill",f);map.setFilter("regions-line",f);
  }
}

/* ============================================================
   图层开关
============================================================ */
document.querySelectorAll("#toolbar .tb-row[data-layer]").forEach(row=>{
  row.addEventListener("click",()=>{
    row.classList.toggle("on");
    const on=row.classList.contains("on");
    const key=row.dataset.layer;
    if(key==="regions"){["regions-fill","regions-line"].forEach(l=>map.getLayer(l)&&map.setLayoutProperty(l,"visibility",on?"visible":"none"));}
    if(key==="points"){["points-circle","points-label"].forEach(l=>map.getLayer(l)&&map.setLayoutProperty(l,"visibility",on?"visible":"none"));}
    if(key==="terrain"){
      if(on){map.setTerrain({source:"terrain",exaggeration:1.6});map.easeTo({pitch:52});}
      else{map.setTerrain(null);map.easeTo({pitch:0});}
    }
  });
});
document.querySelectorAll("#toolbar .tb-row[data-panel]").forEach(row=>{
  row.addEventListener("click",()=>{
    const p=row.dataset.panel;
    if(p==="media")openMediaPanel();
    if(p==="theory")openTheoryPanel();
    if(p==="protect")openProtectPanel();
    if(p==="clan")openClanPanel();
  });
});
